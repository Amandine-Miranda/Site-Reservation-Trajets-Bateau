<!DOCTYPE html>

<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <title>Carte(s) d'embarquement</title>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>
        <video autoplay muted loop id="bg-video">
        <source src="oceanvid3.mp4" type="video/mp4">
        Votre navigateur ne supporte pas les vidéos HTML5.
        </video>

        <header class="box">
            <a href="accueil.html"> <img src="CAN.png" id="logoCAN"> </a>
        </header>

        <main>
            <div id="entrerResa">
                <label for="numResa" id="labelResa"> Entrez le numéro de réservation dont vous voulez voir les cartes d'embarquement :</label>
                <br>
                <input type="text" id="numResa" name="numResa" required minlength="7" maxlength="7">
                <input type="button" value="Envoyer" onclick="chargerAPI()">
            </div>

            <nav id="navigation" class="hidden">
                <img src="flechegauche.png" alt="flechegauche" id="flechegauche" onclick="changerPassagerEnMoins()">
                <div class="carteEmbarquement">
                    <div class="titreCarteEmbarq">
                        <img src="CANbis.png" id="logoCAN2">
                        <div id="containerEmbarq">
                            <h1> Carte d'embarquement </h1>
                            
                        </div>
                    </div>
                    <div class="colonnes">
                        <div id="colonne1">
                            <div class="libelle">
                                <p> Gare de départ </p>
                                <p> Gare d'arrivée </p>
                                <p> Date </p>
                                <p> Heure départ </p>
                                <p> Bateau </p>
                            </div>
                            <div class="infos">
                                <p id="gareDepart"> </p>                   
                                <p id="gareArrivee"> </p>
                                <p id="date"> </p>
                                <p id="heure"> </p>
                                <p id="bateau"> </p>
                            </div>
                        </div>
                        <div id="colonne2">
                            <div class="libelle">
                                <p> Réservation </p>
                                <p> Nom </p>
                            </div>
                            <div class="infos">
                                <p id="reservation"> </p>
                                <p id="famille"> </p>
                            </div>

                            <hr>

                            <h2 id="catCarte"> Passager </h2>
                            <img src="qrcode.png" id="qrcode">

                            <hr>

                            <div class="libelle">
                                <p class="specPassager"> Nom </p>
                                <p class="specPassager"> Prénom </p>
                                <p> Catégorie </p>
                                <p class="nombre"> Nombre </p>
                                <p> Prix </p>
                            </div>
                            <div class="infos">
                                <p id="nom" class="specPassager"> </p>                   
                                <p id="prenom" class="specPassager"> </p>
                                <p id="categorie"> </p>
                                <p class="nombre" id="nb"> </p>
                                <p id="prix"> </p>
                            </div>
                        </div>
                    </div>
                </div>
                <img src="flechedroite.png" alt="flechedroite" id="flechedroite" onclick="changerPassagerEnPlus()">
            </nav>
            <h2 id="compteur"></h2>
        </main>

        <footer class="box2">
            <p> Compagnie Alsacienne de Navigation, 2025. Tous droits réservés </p>
        </footer>

        <script src="test.js"></script>
    </body>
</html>
